<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperChat</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2430;--mute:#66707d;--line:#d8dee5;--me:#1b2430;--me-ink:#fff;
--flights:#2f5fd0;--shopping:#b7791f;--cinema:#7a3e8e;--other:#66707d}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--panel:#1b2128;--ink:#e8ecf0;--mute:#8e99a6;--line:#2c343d;--me:#e8ecf0;--me-ink:#12161b;
--flights:#7ba0ff;--shopping:#e3a94d;--cinema:#c995dc;--other:#8e99a6}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
h1{font-size:1.1rem;margin:0;font-weight:650;letter-spacing:.01em}
header small{color:var(--mute)}
button{font:inherit;cursor:pointer}
#reset{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:4px 10px}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px;border-left:4px solid var(--other)}
.bot.flights{border-left-color:var(--flights)}.bot.shopping{border-left-color:var(--shopping)}.bot.cinema{border-left-color:var(--cinema)}
.tag{display:block;font-size:.78rem;color:var(--mute);margin-bottom:2px}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
input{flex:1;font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--flights);outline-offset:2px}
#send{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:0 18px;font-weight:600}
.hint{color:var(--mute);text-align:center;margin:auto;max-width:34ch}
</style>
</head>
<body>
<div class="app">
  <header><div><h1>SuperChat</h1><small>Flights, shopping and cinema in one chat</small></div><button id="reset" type="button">New chat</button></header>
  <div id="log" aria-live="polite"><p class="hint" id="hint">Ask about a flight, a product or a film. You can switch topics at any time.</p></div>
  <form id="f"><input id="m" autocomplete="off" placeholder="Type a message…" aria-label="Message" autofocus><button id="send">Send</button></form>
</div>
<script>
let sid=null;const log=document.getElementById('log'),m=document.getElementById('m');
const LABEL={flights:'Flights',shopping:'Shopping',cinema:'Cinema',mixed:'Flights + Shopping + Cinema'};
function add(cls,text,tag){document.getElementById('hint')?.remove();const d=document.createElement('div');d.className='msg '+cls;
 if(tag){const t=document.createElement('span');t.className='tag';t.textContent=tag;d.appendChild(t)}
 d.appendChild(document.createTextNode(text));log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const t=m.value.trim();if(!t)return;m.value='';add('me',t);
 const wait=add('bot','…');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:t})});
  const j=await r.json();sid=j.session_id;wait.remove();
  const cls=['flights','shopping','cinema'].includes(j.category)?j.category:'';
  add('bot '+cls,j.reply,LABEL[j.category]||'')}
 catch(err){wait.textContent='Connection problem. Please try again.'}});
document.getElementById('reset').addEventListener('click',async()=>{if(sid)await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:''})});
 sid=null;log.innerHTML='<p class="hint" id="hint">Ask about a flight, a product or a film. You can switch topics at any time.</p>'});
</script>
</body>
</html>
